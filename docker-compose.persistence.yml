# Optional SMS persistence: Postgres + MQTT listener.
# Main sms2mqtt bridge is NOT included — run it separately or add to your compose.
# Usage: docker compose -f docker-compose.persistence.yml up -d
#        OR docker stack deploy -c docker-compose.persistence.yml <stackname>
#
# Important: Do NOT set "persistence_pgdata: null" — use "persistence_pgdata:" (no value).
# For Docker Stack/Swarm, ports use mode: host so localhost:5432 works on the node.
name: ${SMS2MQTT_PERSISTENCE:-sms2mqtt-persistence}

x-logging: &persistence-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    # Port 5432 on host so you can psql -h localhost -p 5432. mode: host required for docker stack deploy.
    ports:
      - target: 5432
        published: "${PGPORT_HOST:-5432}"
        protocol: tcp
        mode: host
    environment:
      POSTGRES_DB: sms2mqtt
      POSTGRES_USER: sms2mqtt
      POSTGRES_PASSWORD: ${PGPASSWORD:-sms2mqtt}
    volumes:
      - persistence_pgdata:/var/lib/postgresql/data
      - ./sms2mqtt-persistence/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms2mqtt -d sms2mqtt"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging: *persistence-logging

  sms2mqtt-persistence:
    build: ./sms2mqtt-persistence
    environment:
      HOST: ${MQTT_HOST:-localhost}
      PORT: ${MQTT_PORT:-1883}
      PREFIX: ${MQTT_PREFIX:-sms2mqtt}
      USER: ${MQTT_USER:-}
      PASSWORD: ${MQTT_PASSWORD:-}
      USETLS: ${MQTT_USETLS:-false}
      CLIENTID: sms2mqtt-persistence
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: sms2mqtt
      PGUSER: sms2mqtt
      PGPASSWORD: ${PGPASSWORD:-sms2mqtt}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Optional REST API (Firebase): set API_PORT and mount Firebase JSON, e.g. FIREBASE_CREDENTIALS=/secrets/firebase.json
      API_PORT: ${API_PORT:-}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
    # When using API, expose port (e.g. add: ports: ["8080:8080"]) and mount Firebase JSON.
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 50
    logging: *persistence-logging

volumes:
  persistence_pgdata:
